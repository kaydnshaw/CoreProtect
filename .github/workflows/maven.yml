#!/bin/bash

# Check if Maven is installed
if ! [ -x "$(command -v mvn)" ]; then
  echo "Error: Maven is not installed." >&2
  exit 1
fi

# Run Maven clean and package
echo "Compiling the plugin..."
mvn clean package

# Check if the build was successful
if [ $? -ne 0 ]; then
  echo "Build failed!" >&2
  exit 1
fi

echo "Build successful! Plugin JAR is located in $OUTPUT_DIR"
