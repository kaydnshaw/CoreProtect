#!/bin/bash

# Variables
PLUGIN_SOURCE_DIR="/path/to/plugin/source"
OUTPUT_DIR="/path/to/output/directory"

# Navigate to the source directory
cd "$PLUGIN_SOURCE_DIR" || { echo "Source directory not found!"; exit 1; }

# Check if Maven is installed
if ! [ -x "$(command -v mvn)" ]; then
  echo "Error: Maven is not installed." >&2
  exit 1
fi

# Run Maven clean and package
echo "Compiling the plugin..."
mvn clean package

# Check if the build was successful
if [ $? -ne 0 ]; then
  echo "Build failed!" >&2
  exit 1
fi

# Move the resulting JAR to the output directory
mkdir -p "$OUTPUT_DIR"
cp target/*.jar "$OUTPUT_DIR"

echo "Build successful! Plugin JAR is located in $OUTPUT_DIR"
